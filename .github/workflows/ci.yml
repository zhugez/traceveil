name: checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - run: cargo build --release --locked
  contracts-and-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.13"
      - run: cargo build --release --locked
      - run: python -m pip install "jsonschema>=4,<5"
      - run: python scripts/check_contracts.py
      - run: python benchmarks/diagnostic/evaluate.py
      - run: python scripts/demo.py
      - run: python scripts/check_terminal.py target/release/traceveil
      - run: cargo install cargo-audit --version 0.23.0 --locked
      - run: cargo audit
      - run: cargo install cargo-deny --version 0.22.1 --locked
      - run: cargo deny check licenses sources
      - run: python scripts/package.py
      - run: python scripts/check_install.py
      - run: python scripts/check_release.py
      - run: python scripts/check_runtime.py
      - run: python scripts/prepare_release.py
      - run: cd target/dist && sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: traceveil-local-product-candidate
          path: target/dist/*
          if-no-files-found: error
