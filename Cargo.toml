[package]
name = "traceveil"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
description = "A local-first diagnostic CLI for AI coding agents"
repository = "https://github.com/zhugez/traceveil"
readme = "README.md"
include = ["src/**", "tests/**", "benchmarks/fixtures/**", "skill-data/**", "skills/**", "schemas/**", "README.md", "LICENSE", "SECURITY.md", "Cargo.lock"]

[dependencies]
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
time = { version = "0.3", features = ["parsing"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
lto = "thin"
strip = true
