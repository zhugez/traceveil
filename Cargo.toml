[package]
name = "traceveil"
version = "0.2.0-rc.1"
edition = "2024"
license = "GPL-3.0-only"
description = "Debug your coding agents. Local-first diagnostics with evidence."
repository = "https://github.com/zhugez/traceveil"
readme = "README.md"
include = ["src/**", "tests/**", "benchmarks/fixtures/**", "skill-data/**", "skills/**", "schemas/**", "docs/**", "assets/brand/**", "README.md", "CHANGELOG.md", "LICENSE", "SECURITY.md", "Cargo.lock"]

[dependencies]
clap = { version = "4.6", features = ["derive"] }
clap_complete = "4.6"
console = "0.16"
dialoguer = { version = "0.12", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
time = { version = "0.3", features = ["parsing"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
lto = "thin"
strip = true
